name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmaflow
          POSTGRES_PASSWORD: pharmaflow
          POSTGRES_DB: pharmaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmaflow -d pharmaflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest tests/unit
      - name: Cache FastEmbed models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: ${{ runner.os }}-${{ runner.arch }}-fastembed-BAAI/bge-small-en-v1.5-Qdrant/bm25-Xenova/ms-marco-MiniLM-L-6-v2
      - run: uv run --locked python -m rag.download_models
      - run: uv run --locked python -m rag.index
      - run: uv run --locked pytest tests/integration
      - run: docker build -t pharmaflow-sandbox:1 sandbox
      - run: uv run --locked pytest -m docker tests/docker
