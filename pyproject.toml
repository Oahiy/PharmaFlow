[project]
name = "pharmaflow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker",
    "fastapi",
    "fastembed",
    "fastmcp<4",
    "httpx",
    "httpx-sse>=0.4.3",
    "langchain-core>=1.8.4",
    "langchain-mcp-adapters",
    "langchain-openai",
    "langfuse",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "matplotlib",
    "mcp<2",
    "openai>=3.57.0",
    "pandas",
    "pillow",
    "psycopg[binary,pool]",
    "pydantic",
    "python-dotenv>=1.2.4",
    "python-multipart",
    "pyyaml",
    "qdrant-client",
    "rdkit",
    "requests",
    "streamlit",
    "urllib3",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not docker'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: requires a Docker daemon and the built sandbox image"]

[tool.ruff]
target-version = "py312"
