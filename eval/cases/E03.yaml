id: E03
category: exception
question: |
  在 PubMed 原样检索 "pharmaflowtask2nomatchxq9z"[Title/Abstract]，最多返回 5 条。
  在 openFDA 用通用名 pharmaflow-task2-no-match-xq9z 查 warnings_and_cautions。分别报告两个来源本次查到什么。
accepted_paths:
  - - id: articles
      tool: search_pubmed
      request: {query: '"pharmaflowtask2nomatchxq9z"[Title/Abstract]', max_results: 5}
    - id: label
      tool: get_label_section
      request: {drug: pharmaflow-task2-no-match-xq9z, fields: [warnings_and_cautions]}
checks:
  - {type: tool_matches, step: articles, value: {total_count: 0, returned_count: 0, results: []}}
  - {type: tool_matches, step: label, value: {total_count: 0, returned_count: 0, results: []}}
  - {type: answer_regex, pattern: '\bPubMed\b'}
  - {type: answer_regex, pattern: '\bopenFDA\b'}
judge:
  threshold: 3
  rubric:
    coverage: 分别说明 PubMed 和 openFDA 本次都没有查到匹配结果。
    grounded: 对应两项成功返回的零结果，不虚构 PMID、说明书、研究或不良事件数据。
    correct_scope: 将结论限定于本次检索，不把零结果解读为该药安全、没有不良事件或某条证据已经证伪。
