id: M01
category: multi_hop
question: |
  在 ClinicalTrials.gov 用疾病条件 NSCLC、关键词 KRAS G12C、分期 PHASE3 检索，最多返回 5 条，不限定药物。
  取得检索结果后，查询返回的第一项试验，限定严重（serious）不良事件，按原词 Alanine aminotransferase increased 过滤。
  请标明试验号与事件口径，并逐组按「组名 受影响人数/风险人数」报告。
accepted_paths:
  - - id: trials
      tool: search_trials
      request: {condition: NSCLC, query: KRAS G12C, phase: PHASE3, max_results: 5}
    - id: events
      tool: get_trial_adverse_events
      request: {nct_id: NCT04303780, category: serious, term: Alanine aminotransferase increased}
      from_results:
        nct_id: {step: trials, path: results.0.nct_id}
checks:
  - {type: tool_matches, step: trials, path: results.0.nct_id, value: NCT04303780}
  - type: tool_matches
    step: events
    value: {nct_id: NCT04303780, category: serious, has_results: true}
  - type: tool_matches
    step: events
    path: adverse_events
    value:
      groups:
        results:
          - {group_id: EG000, title: Docetaxel}
          - {group_id: EG001, title: AMG 510}
          - {group_id: EG002, title: 'Docetaxel, Then Switched to AMG 510'}
      serious:
        matched_count: 1
        results:
          - term: Alanine aminotransferase increased
            stats:
              results:
                - {group_id: EG000, num_affected: 0, num_at_risk: 151}
                - {group_id: EG001, num_affected: 1, num_at_risk: 169}
                - {group_id: EG002, num_affected: 1, num_at_risk: 46}
  - {type: answer_regex, pattern: '(?<![A-Z0-9])NCT04303780(?![A-Z0-9])'}
  - {type: answer_regex, pattern: '严重|serious'}
  - {type: answer_regex, pattern: 'ALT\s*升高|丙氨酸氨基转移酶升高|Alanine aminotransferase increased'}
  - {type: answer_regex, pattern: '(?:Docetaxel|多西他赛)[^\n]{0,30}?(?<!\d)0\s*/\s*151\b'}
  - {type: answer_regex, pattern: '(?:AMG\s*510|sotorasib|索托拉西布)[^\n]{0,30}?(?<!\d)1\s*/\s*169\b'}
  - {type: answer_regex, pattern: '(?:交叉|转用|切换|转换|switched|crossover)[^\n]{0,48}?(?<!\d)1\s*/\s*46\b'}
