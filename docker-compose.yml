services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: pharmaflow
      POSTGRES_DB: pharmaflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  qdrant_data:
